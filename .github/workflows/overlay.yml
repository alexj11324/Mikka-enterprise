name: Pinned overlay contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Sequential full builds keep peak memory bounded. Uses the
      # standard hosted runner; no runner provisioning or credentials.
      - name: Build community and reject private artifact contamination
        run: node scripts/build.mjs community
      - name: Build enterprise against the same pinned public core
        run: node scripts/build.mjs enterprise
