name: Pinned overlay contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Sequential full builds keep peak memory bounded. Uses the
      # standard hosted runner; no runner provisioning or credentials.
      - name: Build community and reject private artifact contamination
        run: node scripts/build.mjs community
      - name: Build enterprise against the same pinned public core
        run: node scripts/build.mjs enterprise
      - name: Real split-database policy and compiled HTTP integration
        run: node scripts/test-policy-integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-split-evidence
          path: .build/policy-integration-evidence/
          if-no-files-found: ignore
